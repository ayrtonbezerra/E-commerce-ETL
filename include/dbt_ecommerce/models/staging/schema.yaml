version: 3

models:
  - name: stg_customers
    description: "Dados tratados de clientes"
    columns:
      - name: id
        data_tests:
          - unique
          - not_null

      - name: name
        data_tests:
          - not_null

      - name: email
        data_tests:
          - not_null

  - name: stg_products
    description: "Dados tratados de produtos"
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

      - name: price
        data_tests:
          - not_null

      - name: cost
        data_tests:
          - not_null

  - name: stg_orders
    description: "Dados tratados de pedidos"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: id

      - name: status
        data_tests:
          - not_null
          - accepted_values:
              values: ['completo', 'cancelado']

  - name: stg_order_items
    description: "Itens associados aos pedidos"
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id

      - name: quantity
        data_tests:
          - not_null

  - name: stg_cancelamentos
    description: "Cancelamentos de pedidos"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: cancel_date
        data_tests:
          - not_null