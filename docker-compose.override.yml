services:
  ecommerce-db:
    image: postgres:17
    env_file:
      - .env
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce_user
    ports:
      - "5433:5432"
    volumes:
      - ecommerce_data:/var/lib/postgresql/data
    networks:
      - airflow

volumes:
  ecommerce_data: